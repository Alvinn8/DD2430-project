services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dd2430-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/service-account.json:/app/service-account.json
    environment:
      - ENVIRONMENT=development
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - GCP_LOCATION=europe-west1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dd2430-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
